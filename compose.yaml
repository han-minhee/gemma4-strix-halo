name: amd-halo-gemma4
services:
  inference:
    image: ${HALO_IMAGE:?Set the tested local image ID}
    pull_policy: never
    user: "1000:1000"
    group_add:
      - "${RENDER_GID:?Set the inference host render GID}"
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    ports:
      - "127.0.0.1:${HALO_PORT:-8080}:8080"
    volumes:
      - /srv/amd-halo/models:/models:ro,z
      - /srv/amd-halo/cache:/cache:rw,z
    environment:
      XDG_CACHE_HOME: /cache
      MESA_SHADER_CACHE_DIR: /cache/mesa
      MESA_SHADER_CACHE_MAX_SIZE: 512M
    secrets:
      - api_key
    command:
      - --model
      - /models/${MODEL_FILE:-gemma-4-31B-it-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --api-key-file
      - /run/secrets/api_key
      - --alias
      - gemma-4-31b
      - --n-gpu-layers
      - "${GPU_LAYERS:-999}"
      - --threads
      - "${THREADS:-2}"
      - --threads-batch
      - "${THREADS_BATCH:-2}"
      - --ctx-size
      - "${CONTEXT:-8192}"
      - --parallel
      - "${PARALLEL:-1}"
      - --fit
      - "off"
      - --cont-batching
      - --batch-size
      - "${BATCH:-2048}"
      - --ubatch-size
      - "${UBATCH:-512}"
      - --flash-attn
      - "${FLASH_ATTN:-on}"
      - --cache-type-k
      - "${CACHE_K:-f16}"
      - --cache-type-v
      - "${CACHE_V:-f16}"
      - --load-mode
      - "${LOAD_MODE:-none}"
      - --metrics
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
secrets:
  api_key:
    file: ${API_KEY_FILE:?Set a private API key file outside Git}
